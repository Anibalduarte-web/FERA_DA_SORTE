<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fera da Sorte</title>
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

    
body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
}

.container {
    position: relative;
    width: 1000px;
    max-width: 100%;
}

.container img { width: 100%; display: block; }

/* Áreas invisíveis clicáveis no Computador */
.area-click {
    position: absolute;
    top: 35%;
    left: 34%;
    width: 28%;
    height: 5%;
    border: none; /* Apenas para debug, remova depois */
    cursor: pointer; z-index: 10;
}
/* =======================================================
   BOTÃO SONHOS E PALPITES
   ======================================================= */

.area-sonhos{

    position:absolute;

    top:48%;

    left:73%;

    width:22%;

    height:8.5%;

    border:none;

    cursor:pointer;

    z-index:15;

}
.area-palpite {
    position: absolute;
    top: 35%;
    left: 74%;
    width: 20%;
    height: 7%;
    border: none; /* Apenas para debug, remova depois */
    cursor: pointer; z-index: 10;

}
/* =======================================================
   BOTÃO OUTROS RESULTADOS
   ======================================================= */

.area-outros{

    position:absolute;

    top:73.2%;

    left:73%;

    width:22%;

    height:8.5%;

    cursor:pointer;

    z-index:15;

}

/* =======================================================
   MODAL CONSULTA
   ======================================================= */

.modal{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:rgba(0,0,0,.75);

    justify-content:center;

    align-items:center;

    z-index:9999;

}

.modal-box{

    background:#111;

    border:2px solid gold;

    border-radius:12px;

    width:360px;

    max-width:90%;

    padding:25px;

    text-align:center;

    color:white;

}

.modal-box h2{

    color:gold;

    margin-bottom:20px;

}

.modal-box input{

    width:100%;

    padding:12px;

    font-size:16px;

    border-radius:8px;

    border:none;

}

.modal-box button{

    margin-top:18px;

    padding:10px 20px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:15px;

    margin-right:8px;

}

.btnConsultar{

    background:gold;

    color:black;

    font-weight:bold;

}

.btnCancelar{

    background:#b00000;

    color:white;

}

/* CAIXA DE RESULTADOS */

.tabela-box {
    position: absolute;
    top: 36%; left: 18%;
    width: 46%; height: 48%;
    background: rgba(10, 7, 2, 0.97);
    border: 2px solid #c9a227;
    border-radius: 12px;
    display: none;
    flex-direction: column;
    z-index: 20;
    padding: 10px;
    box-shadow: 0 0 24px rgba(201,162,39,0.4);
}

.botoes-filtro {
    display: flex; gap: 6px;
    justify-content: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
}

.botoes-filtro button {
    background: #2a1f10; color: #c9a227;
    border: 1px solid #c9a227;
    padding: 5px 12px; border-radius: 6px;
    cursor: pointer; font-weight: bold;
    font-size: 11px; transition: 0.2s;
}

.botoes-filtro button:hover {
    background: #c9a227;
    color: #1a1008;
    transform: scale(1.05);
}

.btn-fechar {
    background: #7f1d1d !important;
    color: white !important;
    border-color: #ef4444 !important;
}

.btn-palpite-cel {
    display: none !important;
}

.cabecalho {
    display: grid;
    grid-template-columns: 1.2fr 1fr 0.8fr 1.1fr 1.1fr 0.6fr 1.6fr;
    text-align: center;
    color: #c9a227;
    font-weight: bold;
    font-size: 11px;
    border-bottom: 1px solid #c9a227;
    padding-bottom: 6px;
    margin-bottom: 6px;
}

.grid-resultados {
    overflow-y: auto;
    flex: 1;
    padding-right: 4px;
}

.grid-resultados::-webkit-scrollbar {
    width: 5px;
}

.grid-resultados::-webkit-scrollbar-thumb {
    background: #c9a227;
    border-radius: 4px;
}

.linha {
    display: grid;
    grid-template-columns: 1.2fr 1fr 0.8fr 1.1fr 1.1fr 0.6fr 1.6fr;
    text-align: center;
    padding: 6px 3px;
    margin-bottom: 4px;
    border-radius: 5px;
    font-size: 12px;
    color: white;
    border-left: 3px solid #c9a227;
    background: rgba(201,162,39,0.07);
    align-items: center;
    animation: fadeIn 0.3s;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
}

.grupo-col {
    font-weight: bold;
    color: #c9a227;
}

.bicho-col {
    font-weight: bold;
    font-size: 13px;
}

.msg-status {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-top: 20px;
}

.msg-erro {
    color: #ef4444;
}

.titulo-data{

    background:#1a1a1a;

    color:#FFD700;

    border:2px solid #FFD700;

    padding:12px;

    margin:20px 0 10px 0;

    text-align:center;

    font-size:20px;

    font-weight:bold;

    border-radius:8px;

    letter-spacing:1px;

}
/* =========================================================
📱 MODO CELULAR (APP RESPONSIVO PROFISSIONAL)
   ========================================================= */

@media(max-width: 768px) {

    body {
        align-items: flex-start;
        padding: 0;
        margin: 0;
    }

    .container {
        width: 100%;
        min-height: 100vh;
    }

    .btn-fechar{
        display:none !important;
    }

    /* Tabela vira a tela inteira do App */
    .tabela-box {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        border: none;
        border-radius: 0;
        background: #0a0a0a;
        display: none;
        padding: 10px 6px;
    }

    /* Cabeçalho falso que aparece apenas no celular */
    .tabela-box::before {
        content: 'FERA DA SORTE';
        display: block;
        text-align: center;
        color: #c9a227;
        font-size: 18px;
        font-weight: bold;
        padding: 15px 0 20px 0;
        text-shadow: 0 0 10px rgba(201,162,39,0.5);
    }

    /* Botões crescem e se adaptam aos dedos */
    .botoes-filtro {
        gap: 8px;
        margin-bottom: 15px;
    }

    .botoes-filtro button {
        padding: 10px 8px;
        font-size: 13px;
        flex: 1 1 30%;
    }

    /* Exibir botão especial do João no mobile */
    .btn-palpite-cel {
        display: inline-block !important;
        background: #b91c1c !important;
        color: white !important;
        border-color: #ef4444 !important;
        flex: 1 1 100% !important;
    }

    /* Textos saltam à vista */
    .cabecalho {
        font-size: 12px;
        padding-bottom: 8px;
    }

    .linha {
        font-size: 14px;
        padding: 12px 2px;
        margin-bottom: 6px;
    }

    .bicho-col {
        font-size: 15px;
    }

    .grid-resultados::-webkit-scrollbar {
        width: 0px;
    }
}

/* =======================================================
   OUTROS RESULTADOS — TABELA TEMPORÁRIA
   ======================================================= */

.tabela-box.historico .botoes-filtro,
.tabela-box.historico .cabecalho {
    display: none;
}

.tabela-box.historico .grid-resultados {
    padding-right: 4px;
}

.historico-titulo {
    background: #1a1a1a;
    color: #FFD700;
    border: 2px solid #FFD700;
    padding: 10px;
    margin: 4px 0 8px 0;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
}

.historico-subtitulo {
    color: white;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    margin: 4px 0 10px 0;
}

.historico-tabela-wrap {
    overflow-x: auto;
    margin-bottom: 16px;
}

.historico-tabela {
    width: 100%;
    border-collapse: collapse;
    color: white;
    font-size: 12px;
    text-align: center;
}

.historico-tabela th {
    background: #fffda0;
    color: #111;
    border: 1px solid #fff;
    padding: 6px 4px;
    font-weight: bold;
}

.historico-tabela td {
    background: rgba(255, 253, 160, 0.95);
    color: #111;
    border: 1px solid white;
    padding: 6px 4px;
}

.historico-fechar {
    display: block !important;
    width: 100%;
    margin-top: 8px;
}

@media(max-width: 768px) {

    .historico-tabela {
        font-size: 13px;
    }

    .historico-tabela th,
    .historico-tabela td {
        padding: 8px 4px;
        white-space: nowrap;
    }

    .historico-titulo {
        font-size: 17px;
    }
}

</style>
</head>
<body>

<div class="container">

    <img src="site-fera-da-sorte.png" alt="Fera da Sorte">

    <div class="area-click" onclick="toggleResultados()"></div>

    <div class="area-palpite" onclick="abrirPalpites()"></div>

    <div class="area-outros" onclick="abrirOutrosResultados()"></div>

    <div class="area-sonhos" onclick="abrirSonhos()"></div>

    <div id="modalOutros" class="modal">
        <div class="modal-box">
            <h2>Outros Resultados</h2>
            <input
                id="dataConsulta"
                type="text"
                inputmode="numeric"
                maxlength="10"
                placeholder="DD-MM-AAAA"
                autocomplete="off"
            >
            <button class="btnConsultar" onclick="consultarOutrosResultados()">Consultar</button>
            <button class="btnCancelar" onclick="fecharModalOutros()">Cancelar</button>
        </div>
    </div>

    <div id="tabela" class="tabela-box">

        <div class="botoes-filtro">

            <button onclick="carregarResultados()">🔄 Todos</button>

            <button onclick="carregarResultados('09:30')">09:30</button>

            <button onclick="carregarResultados('11:30')">11:30</button>

            <button onclick="carregarResultados('14:30')">14:30</button>

            <button onclick="carregarResultados('16:30')">16:30</button>

            <button onclick="carregarResultados('18:30')">18:30</button>

            <button onclick="carregarResultados('20:00')">20:00</button>

            <button onclick="carregarResultados('21:30')">21:30</button>

            <!-- Botão especial do João visível só no celular -->

            <button
                class="btn-palpite-cel"
                onclick="abrirPalpites()">
                YouTube: Palpites do João
            </button>

            <!-- Botão fechar sumirá no celular -->

            <button
                class="btn-fechar"
                onclick="fecharTabela()">
                ✖ Fechar
            </button>

        </div>

        <div class="cabecalho">

            <div>Banca</div>
            <div>Hora</div>
            <div>Prêmio</div>
            <div>Milhar</div>
            <div>Centena</div>
            <div>Grupo</div>
            <div>Bicho</div>

        </div>

        <div id="lista-resultados" class="grid-resultados">

            <div class="msg-status">Carregando...</div>

        </div>

    </div>

</div>

<script>

var EMOJI = {
    "Avestruz":"🦩",
    "Aguia":"🥩",
    "Burro":"🐴",
    "Borboleta":"🦋",
    "Cachorro":"🐶",
    "Cabra":"🐐",
    "Carneiro":"🐏",
    "Camelo":"🐫",
    "Cobra":"🐍",
    "Coelho":"🐇",
    "Cavalo":"🐎",
    "Elefante":"🐘",
    "Galo":"🐓",
    "Gato":"🐱",
    "Jacare":"🐊",
    "Leao":"🦁",
    "Macaco":"🐒",
    "Porco":"🐖",
    "Pavao":"🧊",
    "Peru":"🦃",
    "Touro":"🐂",
    "Tigre":"🐅",
    "Urso":"🐻",
    "Veado":"🦌",
    "Vaca":"🐄"
};

function getEmoji(bicho) {

    var b = (bicho || "").trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z]/g, "");

    b = b.charAt(0).toUpperCase() +
        b.slice(1).toLowerCase();

    return EMOJI[b] || "❓";
}

function abrirPalpites() {

    window.open(
        "https://www.youtube.com/channel/UCekfnO-XM6IAepw7gzwukWA",
        "_blank"
    );

}

function abrirSonhos(){

    window.open(
        "https://estreladasorte.site/auto-cadastro?ref1=MzAy&ref2=MzE=",
        "_blank"
    );

}

function fecharTabela() {

    document.getElementById("tabela").style.display = "none";

}

function toggleResultados() {

    var box = document.getElementById("tabela");

    if (box.style.display === "flex") {

        box.classList.remove("historico");

        box.style.display = "none";

        box.style.visibility = "hidden";

    } else {

        box.classList.remove("historico");

        box.style.display = "flex";

        box.style.visibility = "visible";

        carregarResultadosHoje();

    }

}

window.onload = function () {

    var box = document.getElementById("tabela");

    box.style.display = "none";

    box.style.visibility = "hidden";

    console.log("Página carregada. Resultados serão atualizados ao clicar em Resultados.");

}
function carregarResultados(filtro) {

    filtro = filtro || "";

    var lista = document.getElementById("lista-resultados");

    lista.innerHTML =
        '<div class="msg-status">Carregando...</div>';

    fetch("resultados.csv?t=" + Date.now(), {
        cache: "no-store"
    })
    .then(function(r){

        console.log("CSV veio de:", r.url);

        if(!r.ok)
            throw new Error("HTTP " + r.status);

        return r.text();

    })
    .then(function(texto) {

        var linhas = texto.trim().split("\n");

        console.log("Linhas do CSV:", linhas.length);

        if (linhas.length <= 1) {

            lista.innerHTML =
                '<div class="msg-status">Arquivo CSV vazio.</div>';

            return;
        }

        var html = "";

        var total = 0;

        var dataAnterior = "";

        for (var i = 1; i < linhas.length; i++) {

            var l = linhas[i].trim();

            if (!l)
                continue;

            var c = l.split(";");

            var data = (c[0] || "").trim();

            console.log(data);

            if (c.length < 8)
                continue;

            var banca   = (c[1] || "").trim();
            var hora    = (c[2] || "").trim();
            var premio  = (c[3] || "").trim();
            var milhar  = (c[4] || "").trim();
            var centena = (c[5] || "").trim();
            var grupo   = (c[6] || "").trim().padStart(2, "0");
            var bicho   = (c[7] || "").trim();

            var emoji = getEmoji(bicho);

            if (filtro && hora !== filtro)
                continue;

            total++;

            if (data !== dataAnterior) {

                html +=
                    '<div class="titulo-data">' +
                    '📅 RESULTADOS DO DIA ' +
                    data +
                    '</div>';

                dataAnterior = data;
            }

            html +=
                '<div class="linha">' +
                    '<div>' + banca   + '</div>' +
                    '<div>' + hora    + '</div>' +
                    '<div>' + premio  + '</div>' +
                    '<div>' + milhar  + '</div>' +
                    '<div>' + centena + '</div>' +
                    '<div class="grupo-col">' + grupo + '</div>' +
                    '<div class="bicho-col">' +
                        emoji + ' ' + bicho +
                    '</div>' +
                '</div>';
        }

        lista.innerHTML = total > 0
            ? html
            : '<div class="msg-status">Sem resultados para ' +
              (filtro || "mostrar") +
              '.</div>';

    })
    .catch(function(e) {

        lista.innerHTML =
            '<div class="msg-status msg-erro">' +
            '⚠ Erro ao ler resultados.csv<br>' +
            '<small>Certifique-se de estar rodando pelo servidor local.</small>' +
            '</div>';

        console.error(e);

    });
}


/* =======================================================
   RESULTADOS DE HOJE — TRILHA 1
   Atualiza o CSV antes da leitura.
   ======================================================= */

function carregarResultadosHoje(filtro) {

    filtro = filtro || "";

    var lista =
        document.getElementById("lista-resultados");

    lista.innerHTML =
        '<div class="msg-status">Atualizando resultados...</div>';

    fetch("https://desktop-8ni4hc3.tail3b04cc.ts.net/atualizar?t=" + Date.now(), {
        cache: "no-store"
    })
    .then(function(resposta) {

        if (!resposta.ok) {
            throw new Error(
                "Erro ao atualizar resultados: HTTP " +
                resposta.status
            );
        }

        return resposta.text();

    })
    .then(function() {

        lista.innerHTML =
            '<div class="msg-status">Lendo resultados atualizados...</div>';

        return fetch("resultados.csv?t=" + Date.now(), {
            cache: "no-store"
        });

    })
    .then(function(resposta) {

        if (!resposta.ok)
            throw new Error(
                "Erro ao ler CSV: HTTP " +
                resposta.status
            );

        return resposta.text();

    })
    .then(function(texto) {

        var linhas = texto.trim().split("\n");

        if (linhas.length <= 1) {

            lista.innerHTML =
                '<div class="msg-status">' +
                'Arquivo CSV vazio.' +
                '</div>';

            return;
        }

        /* Descobre corretamente a data mais recente */

        var ultimaData = "";

        var maiorData = null;

        for (var i = 1; i < linhas.length; i++) {

            var l = linhas[i].trim();

            if (!l)
                continue;

            var c = l.split(";");

            if (c.length < 8)
                continue;

            var d = c[0].trim();

            var p = d.split("/");

            if (p.length !== 3)
                continue;

            var dataObj = new Date(
                parseInt(p[2]),
                parseInt(p[1]) - 1,
                parseInt(p[0])
            );

            if (
                maiorData === null ||
                dataObj > maiorData
            ) {

                maiorData = dataObj;

                ultimaData = d;
            }
        }

        console.log(
            "Última data encontrada:",
            ultimaData
        );

        var html = "";

        var total = 0;

        html +=
            '<div class="titulo-data">' +
            '📅 RESULTADOS DO DIA ' +
            ultimaData +
            '</div>';

        for (var i = 1; i < linhas.length; i++) {

            var l = linhas[i].trim();

            if (!l)
                continue;

            var c = l.split(";");

            if (c.length < 8)
                continue;

            var data = c[0].trim();

            if (data !== ultimaData)
                continue;

            var banca   = c[1].trim();
            var hora    = c[2].trim();
            var premio  = c[3].trim();
            var milhar  = c[4].trim();
            var centena = c[5].trim();
            var grupo   = c[6].trim().padStart(2, "0");
            var bicho   = c[7].trim();

            var emoji = getEmoji(bicho);

            if (filtro && hora !== filtro)
                continue;

            total++;

            html +=
                '<div class="linha">' +
                    '<div>' + banca + '</div>' +
                    '<div>' + hora + '</div>' +
                    '<div>' + premio + '</div>' +
                    '<div>' + milhar + '</div>' +
                    '<div>' + centena + '</div>' +
                    '<div class="grupo-col">' +
                        grupo +
                    '</div>' +
                    '<div class="bicho-col">' +
                        emoji + ' ' + bicho +
                    '</div>' +
                '</div>';
        }

        lista.innerHTML = total > 0
            ? html
            : '<div class="msg-status">' +
              'Sem resultados para hoje.' +
              '</div>';

    })
    .catch(function(e) {

        console.error(
            "Erro ao atualizar resultados:",
            e
        );

        lista.innerHTML =
            '<div class="msg-status msg-erro">' +
            'Erro ao atualizar os resultados.<br><br>' +
            '<small>' + (e && e.message ? e.message : e) + '</small>' +
            '</div>';

    });

}
function substituirNomeFeraDaSorte(texto) {
    return String(texto || "").replace(/Deu\\s+no\\s+Poste/gi, "Fera da Sorte");
}

function abrirOutrosResultados() {

    var modal = document.getElementById("modalOutros");
    var campo = document.getElementById("dataConsulta");

    modal.style.display = "flex";
    campo.value = "";
    campo.focus();
}

function fecharModalOutros() {

    document.getElementById("modalOutros").style.display = "none";
}

function consultarOutrosResultados() {

    var campo = document.getElementById("dataConsulta");

    if (!campo) {
        console.error("Campo de data da Trilha 2 não encontrado.");
        return;
    }

    var data = campo.value.trim();

    if (!data) {
        alert("Informe uma data no formato DD-MM-AAAA.");
        return;
    }

    var partes = data.split("-");

    if (
        partes.length !== 3 ||
        partes[0].length !== 2 ||
        partes[1].length !== 2 ||
        partes[2].length !== 4
    ) {
        alert("Informe a data no formato DD-MM-AAAA.");
        return;
    }
    var data = partes[0] + "/" + partes[1] + "/" + partes[2];

    var lista = document.getElementById("lista-resultados");

    lista.innerHTML =
        '<div class="msg-status">Consultando resultados de ' +
        data +
        '...</div>';

    var url =
    "https://desktop-8ni4hc3.tail3b04cc.ts.net/consultar?data=" +
    encodeURIComponent(data) +
    "&t=" +
    Date.now();

    console.log("Consultando Trilha 2:", url);

    fetch(url, {
        cache: "no-store"
    })
    .then(function(resposta) {

        if (!resposta.ok) {
            throw new Error(
                "Erro HTTP: " + resposta.status
            );
        }

        return resposta.json();
    })
    .then(function(dados) {

        console.log("Resposta da Trilha 2:", dados);

        if (
            !dados ||
            !dados.sucesso ||
            !Array.isArray(dados.resultados) ||
            dados.resultados.length === 0
        ) {

            lista.innerHTML =
                '<div class="msg-status msg-erro">' +
                'Nenhum resultado encontrado para ' +
                data +
                '.</div>';

            return;
        }

        fecharModalOutros();

        var html =
            '<div class="historico-titulo">' +
            'FERA DA SORTE — ' + data +
            '</div>';

        html +=
            '<div class="historico-tabela-wrap">' +
            '<table class="historico-tabela">' +
            '<thead><tr>' +
            '<th>Banca</th>' +
            '<th>Horário</th>' +
            '<th>Prêmio</th>' +
            '<th>Milhar</th>' +
            '<th>Centena</th>' +
            '<th>Grupo</th>' +
            '<th>Bicho</th>' +
            '</tr></thead><tbody>';

        for (var i = 0; i < dados.resultados.length; i++) {

            var r = dados.resultados[i];

            html +=
                '<tr>' +
                '<td>' + (r.Banca || "") + '</td>' +
                '<td>' + (r.Horario || "") + '</td>' +
                '<td>' + (r.Premio || "") + '</td>' +
                '<td>' + (r.Milhar || "") + '</td>' +
                '<td>' + (r.Centena || "") + '</td>' +
                '<td>' + (r.Grupo || "") + '</td>' +
                '<td>' +
                getEmoji(r.Bicho) +
                ' ' +
                (r.Bicho || "") +
                '</td>' +
                '</tr>';
        }

        html +=
            '</tbody></table>' +
            '</div>' +
            '<button class="btn-fechar historico-fechar" ' +
            'onclick="fecharOutrosResultados()">' +
            '✖ Fechar' +
            '</button>';

        lista.innerHTML = html;

        var box = document.getElementById("tabela");

        box.classList.add("historico");
        box.style.display = "flex";
        box.style.visibility = "visible";
    })
    .catch(function(erro) {

        console.error("Erro na Trilha 2:", erro);

        lista.innerHTML =
            '<div class="msg-status msg-erro">' +
            'Erro ao consultar os outros resultados.<br><br>' +
            '<small>' +
            (erro && erro.message ? erro.message : erro) +
            '</small>' +
            '</div>';
    });
}

function fecharOutrosResultados() {

    var box =
        document.getElementById("tabela");

    var lista =
        document.getElementById("lista-resultados");

    box.classList.remove("historico");

    box.style.display = "none";

    box.style.visibility = "hidden";

    /*
     * Limpa a tabela temporária.
     * Nenhum resultado da Trilha 2
     * é salvo no resultados.csv.
     */

    lista.innerHTML =
        '<div class="msg-status">' +
        'Carregando...' +
        '</div>';

}
</script>

</body>
